name: VanillaWeaponsUpgrade
version: '1.1.0'
main: com.vanillaweapons.vwu.VanillaWeaponsPlugin
api-version: '26.3'
description: Survival crafting, powerful TNT, optimised crater jobs and fallout effects.
commands:
  vwu:
    description: Vanilla Weapons Upgrade administration and recipe information
    permission: vwu.admin
    permission-message: Only server operators may use VWU commands.
    usage: /vwu [give|recipes|status|reload|cancel|weather|benchmark|cleanup|beaconreset]
permissions:
  vwu.admin:
    description: Manage custom weapons, explosions and weather.
    default: op
